# DreamWaQ actor: six-frame observation history.
policy_type: dreamwaq
policy_path: policies/dreamwaq/policy.pt
xml_path: assets/little_white_v3/scene.xml
simulation_duration: 60.0
simulation_dt: 0.005
control_decimation: 4
initial_height: 0.31
kps: [20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20]
kds: [0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5]
torque_limit: 27.0
action_scale: 0.25
joint_order:
  - FR_hip_joint
  - FR_thigh_joint
  - FR_calf_joint
  - FL_hip_joint
  - FL_thigh_joint
  - FL_calf_joint
  - RL_hip_joint
  - RL_thigh_joint
  - RL_calf_joint
  - RR_hip_joint
  - RR_thigh_joint
  - RR_calf_joint
default_angles: [0, 0.95, -1.7, 0, 0.95, -1.7, 0, 0.95, -1.7, 0, 0.95, -1.7]
num_obs: 45
num_actions: 12
cmd_init: [0.0, 0.0, 0.0]
keyboard:
  vx_scale: 0.6
  vy_scale: 0.4
  yaw_scale: 0.8
# Input: [batch, 6, 45], oldest frame first. No measured linear velocity.
# CENet, actor, and normalization are embedded in policy.pt.
